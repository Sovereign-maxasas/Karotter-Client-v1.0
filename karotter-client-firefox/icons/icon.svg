<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2877d6"/>
      <stop offset="100%" style="stop-color:#1254b0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.22)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.30)"/>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect x="4" y="4" width="120" height="120" rx="26" ry="26" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Shine overlay -->
  <rect x="4" y="4" width="120" height="60" rx="26" ry="26" fill="url(#shine)"/>
  <!-- Letter K -->
  <text
    x="64" y="90"
    font-family="'Segoe UI', 'Inter', system-ui, sans-serif"
    font-size="80"
    font-weight="800"
    text-anchor="middle"
    fill="#ffffff"
    letter-spacing="-2"
  >K</text>
</svg>
